[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "classcorpus"
version = "0.7.0"
description = "Search local lecture folders with exact citations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Jackson Wu" },
]
keywords = [
    "agent-skill",
    "education",
    "lecture-notes",
    "local-first",
    "retrieval",
    "study-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "platformdirs>=4,<5",
]

[project.scripts]
classcorpus = "classcorpus.cli:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.10,<8",
    "matplotlib>=3.9,<4",
    "mypy>=1.15,<2",
    "Pillow>=10,<14",
    "PyYAML>=6,<7",
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.5,<1",
]
embeddings = [
    "numpy>=2,<3",
    "sentence-transformers>=3,<4",
]
fastembed = [
    "fastembed>=0.4,<1",
]
ocr = [
    "pytesseract>=0.3,<1",
]
pdf = [
    "matplotlib>=3.9,<4",
    "Pillow>=10,<14",
    "reportlab>=4,<5",
]

[project.urls]
Homepage = "https://github.com/haixinnn05/classcorpus"
Documentation = "https://github.com/haixinnn05/classcorpus#readme"
Repository = "https://github.com/haixinnn05/classcorpus"
Issues = "https://github.com/haixinnn05/classcorpus/issues"
Changelog = "https://github.com/haixinnn05/classcorpus/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/classcorpus"]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["classcorpus"]
omit = ["*/classcorpus/scripts/*"]

[tool.coverage.paths]
source = [
    "src/classcorpus",
    "*/site-packages/classcorpus",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
classcorpus = ["py.typed"]

name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build

      - name: Read package version
        id: package
        shell: bash
        run: |
          echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: test "v${PACKAGE_VERSION}" = "${RELEASE_TAG}"

      - name: Build Python distributions
        run: python -m build

      - name: Build Agent Skill archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          git archive --format=zip --prefix=classcorpus/ \
            --output="dist/classcorpus-skill-v${PACKAGE_VERSION}.zip" HEAD

      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/classcorpus-smoke
          /tmp/classcorpus-smoke/bin/python -m pip install dist/*.whl
          CLASSCORPUS_DATA_DIR=/tmp/classcorpus-smoke-data \
            /tmp/classcorpus-smoke/bin/classcorpus doctor --json

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${REPOSITORY}" --clobber

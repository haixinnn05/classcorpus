name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check benchmarks src scripts tests
      - run: ruff format --check benchmarks src scripts tests
      - run: mypy
      - name: Test with subprocess-aware branch coverage
        run: |
          coverage erase
          coverage run -m pytest -q
          coverage combine
          coverage report
      - run: python -m benchmarks.run
      - run: python -m benchmarks.scale

  cold-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install and smoke-test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SMOKE_PY=".wheel-smoke/Scripts/python.exe"
          else
            SMOKE_PY=".wheel-smoke/bin/python"
          fi
          "$SMOKE_PY" -m pip install dist/*.whl
          CLASSCORPUS_DATA_DIR="$RUNNER_TEMP/classcorpus-smoke-data" \
            "$SMOKE_PY" -m classcorpus doctor --json
          CLASSCORPUS_DATA_DIR="$RUNNER_TEMP/classcorpus-smoke-data" \
            "$SMOKE_PY" -m classcorpus script read_lectures \
              --course Absent --json
          "$SMOKE_PY" -c \
            "import classcorpus; from pathlib import Path; assert Path(classcorpus.__file__).with_name('py.typed').is_file()"
